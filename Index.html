<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="description" content="Gentle Touch Home Health & Nursing Care - Compassionate Care, Right at Home. Professional home nursing, baby care, physiotherapy, and 24/7 support in Thane, Mumbai.">
  <title>Gentle Touch | Home Health & Nursing Care</title>
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Leaflet CSS for map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #f4fbfe;
      color: #1e2a3e;
      scroll-behavior: smooth;
    }

    /* color theme: blue (#0f52ba), teal (#1e9c8c), white */
    :root {
      --primary: #0f52ba;
      --primary-dark: #0a3d8a;
      --teal: #1e9c8c;
      --teal-light: #e0f2f0;
      --gray-bg: #f8fafc;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
    }

    /* Sticky navbar */
    .navbar {
      background: white;
      backdrop-filter: blur(0px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 0.8rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .logo h1 {
      font-size: 1.6rem;
      color: var(--primary);
      font-weight: 700;
    }
    .logo p {
      font-size: 0.7rem;
      letter-spacing: 1px;
      color: var(--teal);
      font-weight: 500;
    }
    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      font-weight: 600;
      color: #1e2a3e;
      transition: 0.2s;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--primary);
    }
    .mobile-menu {
      display: none;
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* buttons & containers */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      padding: 0.8rem 1.8rem;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(15,82,186,0.2);
    }
    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: var(--teal);
      color: white;
      padding: 0.8rem 1.8rem;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 600;
      margin-left: 1rem;
      display: inline-block;
    }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
    }
    .hero {
      background: linear-gradient(135deg, #eef9ff 0%, #ffffff 100%);
      border-radius: 2rem;
      margin: 1rem;
      padding: 3rem 2rem;
    }
    .service-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .service-card {
      background: white;
      padding: 1.5rem;
      border-radius: 28px;
      box-shadow: var(--shadow);
      transition: all 0.3s;
      border-left: 5px solid var(--teal);
    }
    .service-card i {
      font-size: 2.2rem;
      color: var(--primary);
      margin-bottom: 1rem;
    }
    .why-card {
      background: white;
      padding: 1.5rem;
      border-radius: 24px;
      text-align: center;
    }
    footer {
      background: #0b2b42;
      color: #cdedff;
      padding: 2rem 1.5rem;
    }
    .floating-wa {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: #25d366;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(0,0,0,0.2);
      z-index: 999;
    }
    .floating-wa a {
      color: white;
      font-size: 2rem;
    }
    .booking-form, .contact-form {
      background: white;
      border-radius: 28px;
      padding: 2rem;
      box-shadow: var(--shadow);
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 24px;
      font-size: 1rem;
    }
    .map-container {
      height: 300px;
      border-radius: 24px;
      overflow: hidden;
      margin: 1rem 0;
    }
    @media (max-width: 860px) {
      .nav-links {
        display: none;
        width: 100%;
        flex-direction: column;
        background: white;
        padding: 1rem;
      }
      .nav-links.show {
        display: flex;
      }
      .mobile-menu {
        display: block;
      }
      .btn-secondary {
        margin-left: 0;
        margin-top: 0.5rem;
      }
    }
    .testimonial {
      background: white;
      border-radius: 24px;
      padding: 1.5rem;
      font-style: italic;
    }
    .admin-section {
      background: #fff3e0;
      border-radius: 24px;
    }
    .success-msg {
      background: #d4edda;
      color: #155724;
      padding: 1rem;
      border-radius: 28px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<!-- Sticky Navbar -->
<div class="navbar">
  <div class="logo">
    <h1>Gentle Touch</h1>
    <p>Home Health & Nursing Care</p>
  </div>
  <div class="mobile-menu" id="mobileMenuBtn">
    <i class="fas fa-bars"></i>
  </div>
  <ul class="nav-links" id="navLinks">
    <li><a href="#" data-page="home">Home</a></li>
    <li><a href="#" data-page="about">About Us</a></li>
    <li><a href="#" data-page="services">Services</a></li>
    <li><a href="#" data-page="booking">Book Now</a></li>
    <li><a href="#" data-page="contact">Contact</a></li>
    <li><a href="#" data-page="admin">Admin</a></li>
  </ul>
</div>

<!-- MAIN CONTENT (SPA style) -->
<main id="appContent"></main>

<!-- Floating WhatsApp -->
<div class="floating-wa">
  <a href="https://wa.me/918369748017?text=Hello%20Gentle%20Touch%2C%20I%20need%20home%20healthcare%20assistance." target="_blank"><i class="fab fa-whatsapp"></i></a>
</div>

<!-- QR section inline later (optional) -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ---------- SPA ROUTING ----------
  let currentPage = "home";

  // Dummy DB simulation via fetch to backend (Node + MongoDB)
  const API_BASE = window.location.origin + '/api'; // we'll handle via Express

  // Helper render functions
  async function renderHome() {
    return `
      <div class="hero container" style="margin-top:1rem">
        <div style="text-align:center; max-width:800px; margin:auto">
          <h1 style="font-size:2.8rem; color:var(--primary)">Trusted Nursing & Allied Health Services at Home</h1>
          <p style="font-size:1.2rem; margin:1rem 0">Your health, comfort, and recovery are our priority.</p>
          <div>
            <a href="#" data-nav="booking" class="btn-primary">📅 Book a Service</a>
            <a href="tel:+918369748017" class="btn-secondary">📞 Call Now</a>
          </div>
        </div>
      </div>

      <div class="container">
        <h2 style="font-size:2rem; text-align:center">Our Premium Services</h2>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:2rem; margin-top:2rem">
          <div>
            <ul style="list-style:none">
              <li><i class="fas fa-hand-holding-heart" style="color:teal"></i> Home Nursing</li>
              <li><i class="fas fa-bath"></i> Dressing / Sponging</li>
              <li><i class="fas fa-syringe"></i> Injection / Saline</li>
              <li><i class="fas fa-lungs"></i> Suction / Nebulizer</li>
              <li><i class="fas fa-utensils"></i> Ryles Tube Feeding</li>
              <li><i class="fas fa-toilet"></i> Catheter / Diaper Care</li>
              <li><i class="fas fa-chart-line"></i> BP / Sugar Monitoring</li>
              <li><i class="fas fa-pills"></i> Medication Management</li>
            </ul>
          </div>
          <div>
            <ul style="list-style:none">
              <li><i class="fas fa-wind"></i> Oxygen / Pulse Monitoring</li>
              <li><i class="fas fa-baby-carriage"></i> Baby Care Services (Newborn & Mother)</li>
              <li><i class="fas fa-hospital-user"></i> ICU Experienced Nursing Care</li>
              <li><i class="fas fa-walking"></i> Physiotherapist</li>
              <li><i class="fas fa-dumbbell"></i> Exercise Assistance</li>
              <li><i class="fas fa-clock"></i> 24/7 Nursing Support</li>
              <li><i class="fas fa-heartbeat"></i> General Nursing Care</li>
            </ul>
          </div>
        </div>
      </div>

      <div class="container">
        <h2 style="text-align:center">Why Choose Us?</h2>
        <div class="service-grid" style="margin-top:2rem">
          <div class="why-card"><i class="fas fa-user-md fa-2x"></i><h3>Experienced & Certified Staff</h3><p>RNs, GNMs, and trained caregivers</p></div>
          <div class="why-card"><i class="fas fa-clock fa-2x"></i><h3>24/7 Availability</h3><p>Emergency or scheduled visits</p></div>
          <div class="why-card"><i class="fas fa-rupee-sign fa-2x"></i><h3>Affordable Pricing</h3><p>Transparent cost plans</p></div>
          <div class="why-card"><i class="fas fa-heart fa-2x"></i><h3>Personalized Care Plans</h3><p>Tailored to each patient</p></div>
        </div>
        <div style="text-align:center; margin: 2rem 0"><a href="#" data-nav="booking" class="btn-primary">Book a Service Today →</a></div>
      </div>
    `;
  }

  function renderAbout() {
    return `
      <div class="container">
        <h2>About Gentle Touch Home Health</h2>
        <div style="background:white; border-radius:28px; padding:2rem; margin-top:1rem">
          <p><strong>Gentle Touch Home Health & Nursing Care</strong> was founded with a mission to deliver compassionate, professional medical care at home. We understand that recovery in a familiar environment accelerates healing. Our nurses, physiotherapists, and caregivers are vetted, experienced, and dedicated to patient dignity.</p>
          <p>We serve Thane, Mumbai, and surrounding areas with round-the-clock availability. Whether it's post-operative care, elder care, newborn support, or chronic illness management, we bring hospital-grade expertise to your doorstep.</p>
          <p>Our values: Empathy, Excellence, and Trust.</p>
        </div>
      </div>
    `;
  }

  async function renderServices() {
    const servicesList = [
      { title: "Home Nursing", desc: "Skilled nurses for post-op, chronic illness, and daily medical support.", icon: "fas fa-user-nurse" },
      { title: "Dressing / Sponging", desc: "Professional wound care and bed bath assistance.", icon: "fas fa-hand-sparkles" },
      { title: "Injection / Saline", desc: "Safe administration of IV fluids, injections at home.", icon: "fas fa-syringe" },
      { title: "Suction / Nebulizer", desc: "Respiratory support with suction machines and nebulizers.", icon: "fas fa-lungs" },
      { title: "Ryles Tube Feeding", desc: "Expert nasogastric tube feeding and care.", icon: "fas fa-utensil-spoon" },
      { title: "Catheter / Diaper Care", desc: "Hygienic catheter management and incontinence care.", icon: "fas fa-toilet-paper" },
      { title: "BP / Sugar Monitoring", desc: "Regular vitals monitoring and health tracking.", icon: "fas fa-heartbeat" },
      { title: "Oxygen / Pulse Monitoring", desc: "Oxygen therapy with pulse oximetry.", icon: "fas fa-wind" },
      { title: "Baby Care Services", desc: "Newborn & mother care, lactation support.", icon: "fas fa-baby" },
      { title: "ICU Experienced Nursing", desc: "Critical care trained nurses for home ICU setup.", icon: "fas fa-procedures" },
      { title: "Physiotherapist", desc: "Rehabilitation and mobility exercises.", icon: "fas fa-walking" },
      { title: "24/7 Nursing Support", desc: "Round-the-clock dedicated nursing staff.", icon: "fas fa-clock" }
    ];
    let html = `<div class="container"><h2>Complete Healthcare Services</h2><div class="service-grid">`;
    servicesList.forEach(s => {
      html += `<div class="service-card"><i class="${s.icon}"></i><h3>${s.title}</h3><p>${s.desc}</p></div>`;
    });
    html += `</div></div>`;
    return html;
  }

  function renderBookingForm(successMsg = null) {
    return `
      <div class="container">
        <h2>Request a Visit</h2>
        <div class="booking-form" id="bookingFormContainer">
          ${successMsg ? `<div class="success-msg">${successMsg}</div>` : ''}
          <form id="bookingSubmitForm">
            <input type="text" id="fullName" placeholder="Full Name" required>
            <input type="tel" id="phone" placeholder="Phone Number" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="text" id="address" placeholder="Complete Address" required>
            <select id="serviceRequired" required>
              <option value="">Select Service</option>
              <option>Home Nursing</option><option>Dressing / Sponging</option><option>Injection / Saline</option>
              <option>Suction / Nebulizer</option><option>Ryles Tube Feeding</option><option>Catheter / Diaper Care</option>
              <option>BP / Sugar Monitoring</option><option>Oxygen / Pulse Monitoring</option><option>Baby Care Services</option>
              <option>Physiotherapist</option><option>24/7 Nursing Support</option>
            </select>
            <input type="datetime-local" id="preferredDateTime" required>
            <textarea rows="3" id="message" placeholder="Additional details..."></textarea>
            <button type="submit" class="btn-primary" style="width:100%">Confirm Booking</button>
          </form>
        </div>
      </div>
    `;
  }

  function renderContact() {
    return `
      <div class="container">
        <h2>Reach Us</h2>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:2rem">
          <div class="contact-form">
            <h3>Send a Message</h3>
            <form id="contactForm">
              <input type="text" placeholder="Name" id="contactName" required>
              <input type="email" placeholder="Email" id="contactEmail" required>
              <textarea rows="3" placeholder="Your query"></textarea>
              <button type="submit" class="btn-primary">Send</button>
            </form>
            <div style="margin-top:1rem"><a href="tel:+918369748017" class="btn-secondary"><i class="fas fa-phone-alt"></i> Click to Call</a></div>
            <div><a href="https://wa.me/918369748017" class="btn-outline" style="display:inline-block; margin-top:1rem"><i class="fab fa-whatsapp"></i> WhatsApp</a></div>
          </div>
          <div>
            <div class="map-container" id="mapid"></div>
            <p><i class="fas fa-map-marker-alt"></i> Gangubai Apartment 507, Mumbra Devi Colony Rd, Near Sent Marry School, Sadguru Nagar, Diva, Thane, Maharashtra 400612</p>
            <p><i class="fas fa-phone"></i> 8369748017</p>
            <p><i class="fas fa-envelope"></i> gentletouchhomecare18@gmail.com</p>
            <p><i class="fas fa-clock"></i> 24/7 – Emergency & Scheduled Visits</p>
          </div>
        </div>
      </div>
    `;
  }

  async function renderAdmin() {
    let bookingsHtml = `<div class="container admin-section"><h2>Admin Panel - Bookings</h2><div id="bookingsList">Loading...</div></div>`;
    // fetch all bookings from API
    try {
      const res = await fetch('/api/bookings');
      const bookings = await res.json();
      if(bookings.length === 0) {
        bookingsHtml = `<div class="container"><p>No bookings yet.</p></div>`;
      } else {
        let table = `<table style="width:100%; background:white; border-radius:16px; padding:1rem"><tr><th>Name</th><th>Phone</th><th>Service</th><th>Date/Time</th><th>Action</th></tr>`;
        bookings.forEach(b => {
          table += `<tr><td>${b.fullName}</td><td>${b.phone}</td><td>${b.serviceRequired}</td><td>${new Date(b.preferredDateTime).toLocaleString()}</td><td><button class="delete-booking" data-id="${b._id}">Delete</button></td></tr>`;
        });
        table += `</table>`;
        bookingsHtml = `<div class="container">${table}</div>`;
      }
    } catch(e) { bookingsHtml = `<div class="container">Error loading admin data. Make sure backend is running.</div>`; }
    return bookingsHtml;
  }

  async function loadPage(page, extra = null) {
    currentPage = page;
    let content = "";
    if(page === "home") content = await renderHome();
    else if(page === "about") content = renderAbout();
    else if(page === "services") content = await renderServices();
    else if(page === "booking") content = renderBookingForm(extra);
    else if(page === "contact") content = renderContact();
    else if(page === "admin") content = await renderAdmin();
    else content = "<div class='container'>404</div>";
    document.getElementById("appContent").innerHTML = content;

    // attach event listeners for dynamic forms/map
    if(page === "contact") {
      setTimeout(() => {
        if(document.getElementById("mapid")) {
          let map = L.map('mapid').setView([19.1667, 73.0167], 13);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
          L.marker([19.1667, 73.0167]).addTo(map).bindPopup("Gentle Touch Home Care, Diva, Thane").openPopup();
        }
      }, 200);
      const contactForm = document.getElementById("contactForm");
      if(contactForm) contactForm.onsubmit = (e) => { e.preventDefault(); alert("Message sent! We'll contact you soon."); contactForm.reset(); };
    }
    if(page === "booking") {
      const bookingForm = document.getElementById("bookingSubmitForm");
      if(bookingForm) {
        bookingForm.onsubmit = async (e) => {
          e.preventDefault();
          const payload = {
            fullName: document.getElementById("fullName").value,
            phone: document.getElementById("phone").value,
            email: document.getElementById("email").value,
            address: document.getElementById("address").value,
            serviceRequired: document.getElementById("serviceRequired").value,
            preferredDateTime: document.getElementById("preferredDateTime").value,
            message: document.getElementById("message").value
          };
          if(!payload.fullName || !payload.phone || !payload.email || !payload.serviceRequired || !payload.preferredDateTime) {
            alert("Please fill all required fields.");
            return;
          }
          const res = await fetch('/api/booking', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(payload)
          });
          if(res.ok) {
            loadPage("booking", "✅ Booking confirmed! A confirmation email has been sent (simulated). Our team will contact you.");
          } else {
            alert("Error submitting booking. Try again.");
          }
        };
      }
    }
    if(page === "admin") {
      document.querySelectorAll(".delete-booking").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          const id = btn.getAttribute("data-id");
          if(confirm("Delete this booking?")) {
            await fetch(`/api/booking/${id}`, { method: 'DELETE' });
            loadPage("admin");
          }
        });
      });
    }
    // highlight nav active
    document.querySelectorAll(".nav-links a").forEach(link => {
      link.classList.remove("active");
      if(link.getAttribute("data-page") === page) link.classList.add("active");
    });
  }

  // Navigation and SPA
  document.addEventListener("click", (e) => {
    const navTarget = e.target.closest("[data-nav]");
    if(navTarget) {
      e.preventDefault();
      const page = navTarget.getAttribute("data-nav");
      if(page) loadPage(page);
    }
    const anchorLink = e.target.closest(".nav-links a");
    if(anchorLink && anchorLink.getAttribute("data-page")) {
      e.preventDefault();
      loadPage(anchorLink.getAttribute("data-page"));
    }
  });
  document.getElementById("mobileMenuBtn")?.addEventListener("click", () => {
    document.getElementById("navLinks").classList.toggle("show");
  });
  // initial load home
  loadPage("home");
</script>
